<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>$subject</title>
    <style>
      @media (max-width: 620px) {
        .container { width: 100% !important; }
        .card { padding: 24px 20px !important; }
        .button a { display: block !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f7;">
    <!-- Preheader: the preview text shown by mail clients. -->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f4f4f7;">$preheader</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;">
      <tr>
        <td align="center" style="padding:32px 12px;">
          <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:100%;">
            <tr>
              <td style="padding:0 4px 16px 4px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;color:#1e1b4b;">
                <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;background-color:#4f46e5;color:#ffffff;font-size:15px;margin-right:8px;">&#8984;</span>$app_name
              </td>
            </tr>
            <tr>
              <td class="card" style="background-color:#ffffff;border-radius:14px;padding:36px 36px 32px 36px;font-family:Inter,Segoe UI,Arial,sans-serif;color:#1f2937;">
                <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#111827;">$heading</h1>
                $body_html
                $button_html
                <p style="margin:24px 0 0 0;font-size:13px;line-height:1.6;color:#6b7280;">$footnote</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0 8px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9ca3af;text-align:center;">
                You received this email because of activity on your $app_name account.<br />
                If this was not you, you can safely ignore it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
